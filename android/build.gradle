buildscript {
    // AGP 9 needs Kotlin Gradle Plugin 2.2.10 or newer
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9.0.x needs Gradle 9.1+ (your wrapper already has 9.3.1) and JDK 17+
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.5.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Same build folder as before (<project>/build), written with the non-deprecated API
rootProject.layout.buildDirectory.set(file('../build'))
subprojects {
    project.layout.buildDirectory.set(file("${rootProject.layout.buildDirectory.get().asFile}/${project.name}"))
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
