// Plugin versions are declared in settings.gradle (plugins block); no buildscript block here,
// otherwise AGP would be declared twice.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Same build folder as before (<project>/build)
rootProject.layout.buildDirectory.set(file('../build'))
subprojects {
    project.layout.buildDirectory.set(file("${rootProject.layout.buildDirectory.get().asFile}/${project.name}"))
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
