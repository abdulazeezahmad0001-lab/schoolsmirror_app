name: schoolsmirror_app
description: "School Mirror admin app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.2
  camera: ^0.11.0+2
  geolocator: ^13.0.1
  image: ^4.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

# ─── LAUNCHER ICONS CONFIGURATION ───
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

# ─── SPLASH SCREEN CONFIGURATION ───
flutter_native_splash:
  color: "#0A1929"
  image: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    color: "#0A1929"

flutter:
  uses-material-design: true
  assets:
    - assets/images/