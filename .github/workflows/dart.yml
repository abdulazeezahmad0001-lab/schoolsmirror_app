name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Clean Flutter
        run: flutter clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      # The 2>&1 | tee build.log saves the output so we can read it if it fails
      - name: Build APK
        run: flutter build apk --release 2>&1 | tee build.log

      # THIS WILL PRINT THE ACTUAL ERROR IN THE SUMMARY IF IT FAILS
      - name: Show Build Error (If Failed)
        if: failure()
        run: grep -i -A 10 "What went wrong" build.log || tail -n 50 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
