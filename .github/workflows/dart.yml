name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false 

      - name: Get dependencies
        run: flutter pub get

      - name: Clean Flutter
        run: flutter clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # This is the exact line you asked for, wrapped in the full workflow
      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation 2>&1 | tee build.log

      - name: Show Build Error (If Failed)
        if: failure()
        run: |
          echo "Here is the actual error from Gradle:"
          grep -i -A 15 "What went wrong" build.log || tail -n 50 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*.apk
