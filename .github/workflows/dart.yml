name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      # Updated to v5 to fix Node 24 deprecation
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Updated to v5 to fix deprecation
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false 

      - name: Get dependencies
        run: flutter pub get

      - name: Clean Flutter
        run: flutter clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK
        run: flutter build apk --release

      # This will print the folder contents so we can see exactly what Flutter named the file
      - name: List APK Output
        run: ls -R build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          # Using a wildcard just in case Flutter names it slightly differently
          path: build/app/outputs/flutter-apk/*.apk
