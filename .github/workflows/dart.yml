name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false # <--- Forces a fresh Flutter download

      - name: Get dependencies
        run: flutter pub get

      - name: Clean Flutter
        run: flutter clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      # FORCE a completely clean Gradle build
      - name: Clean Gradle
        run: cd android && ./gradlew clean

      - name: Build APK
        run: flutter build apk --release

      # This step will print all files inside the output folder to the log so we can see the exact name
      - name: List APK Output
        run: ls -R build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
